# Per-chat capability boundary for Feishu.
#
# The owner's main Feishu DM is unrestricted. Other DMs receive only the base
# allowlist. Group chats also receive the tools listed below. Every change
# requires a gateway restart.

owner_feishu_chat_ids:
  - oc_c8221472cf59b202ccd0682cf6cea296

allowed_tools_for_outsiders:
  - web_search
  - web_extract
  - vision_analyze
  - image_generate

# Group tools stay structured: there is no generic terminal, write_file, patch,
# or process tool. Skill names remain constrained by skills.platform_allowed.
allowed_tools_for_outsider_groups:
  - clarify
  - web_search
  - web_extract
  - tool_search
  - tool_describe
  - skills_list
  - skill_view
  - feishu_doc_read
  - read_file
  - search_files
  - group_cache
  - feishu_doc_manage

# Group members may read resources they explicitly reference in the current
# message. Only these trusted user IDs may create or mutate Feishu documents.
trusted_feishu_user_ids_for_group_mutations:
  - ou_33eeacfbd0c0559b7b734f83503719ab
  - 5397e1a2

# Direct file tools may read the wiki. Reads under group_workspace_root are
# narrowed again at runtime to the current group's hashed subdirectory.
allowed_read_roots_for_outsider_groups:
  - ~/.hermes/wiki

group_workspace_root: ~/.hermes/tmp/group-workspaces

# Exact operator-approved actions. Each maps to one fixed script filename in
# feishu_doc_scripts_root; the group can never supply a script path or argv.
allowed_feishu_script_actions_for_outsider_groups:
  - create
  - append
  - rebuild
  - delete
  - read_url
  - download_file

feishu_doc_scripts_root: ~/.hermes/my-skills/productivity/feishu-docs/scripts
python_executable: ~/.hermes/hermes-agent/venv/bin/python
script_timeout_seconds: 300
group_max_download_bytes: 50000000

# Fail closed if the OS process sandbox is unavailable. The profile permits
# reads/execution/network but permits writes only inside the current group
# workspace, and is inherited by child processes such as curl.
require_process_sandbox: true

block_message: "本会话不支持该工具。群聊仅开放问答、联网搜索、只读 wiki/skill、工具发现/描述、当前群隔离的 tmp 工作区，以及受约束的飞书文档操作；图片、音频、视频和扫描 PDF 由消息入站多模态链路自动处理。"
read_root_block_message: "群聊只允许读取 ~/.hermes/wiki 和当前群自己的 ~/.hermes/tmp/group-workspaces/<群哈希>/；skills/my-skills 只能通过只读 skill 工具访问。"
resource_block_message: "群聊只能读取或下载当前消息、引用消息中明确出现的飞书文档/文件链接。请在本条消息中重新附上目标链接。"
mutation_block_message: "群聊中的飞书文档创建、追加、重建和删除仅允许受信任的维护者执行；修改既有文档时还必须在当前消息或引用中明确附上目标文档链接。"
