# Per-chat capability boundary for Feishu.
#
# The owner's main Feishu DM is unrestricted. Other DMs receive only the base
# allowlist. Group chats also receive the tools listed below. Every change
# requires a gateway restart.

owner_feishu_chat_ids:
  - oc_c8221472cf59b202ccd0682cf6cea296

# The owner DM may attach files to a natural-language HyperTeX request. The
# sandbox plugin copies only the current turn's cached attachments here, then
# injects the stable paths into the MCP call without exposing host paths to the
# model. Staged files are private and expire after one day.
hypertex_asset_staging_root: ~/.hermes/tmp/hypertex-assets
hypertex_max_asset_bytes: 50000000
hypertex_max_assets_per_turn: 6
hypertex_asset_staging_ttl_seconds: 86400

allowed_tools_for_outsiders:
  - web_search
  - web_extract
  - vision_analyze
  - image_generate

# Group tools stay structured: there is no generic terminal, write_file, patch,
# or process tool. Skill names remain constrained by skills.platform_allowed.
allowed_tools_for_outsider_groups:
  - clarify
  - web_search
  - web_extract
  - tool_search
  - tool_describe
  - skills_list
  - skill_view
  - feishu_doc_read
  - read_file
  - search_files
  - group_cache
  - feishu_doc_manage
  - mcp__hypertex__hypertex_list_cases
  - mcp__hypertex__hypertex_create_case
  - mcp__hypertex__hypertex_iterate_case
  - mcp__hypertex__hypertex_get_case
  - mcp__hypertex__tasks_get
  - mcp__hypertex__tasks_cancel
  - mcp__hypertex__tasks_update

# Group members may create, append, or rebuild Feishu documents. Append and
# rebuild still require an explicitly referenced target document. Only these
# trusted user IDs may delete documents. The key keeps its historical
# "mutations" name, but its runtime effect is delete-only.
#
# Roster convention: register ONLY the app-scoped open_id (`ou_…`) from
# ~/.hermes/people.yaml. The inbound hook collects open_id, tenant user_id, and
# union_id from the same signed Feishu sender object and authorizes when any
# exact variant matches, so config stays single-source without becoming
# sensitive to which ID the adapter chooses as SessionSource.user_id.
trusted_feishu_user_ids_for_group_mutations:
  # 周琛 — sole holder. Document deletion is irreversible from the group's
  # side, so this grant stays at one person even when HyperTeX trust widens.
  - ou_33eeacfbd0c0559b7b734f83503719ab

# HyperTeX is exposed in the shared feishu_group toolset, but calls are enabled
# only when both the current chat and current user appear in these allowlists.
trusted_feishu_chat_ids_for_group_hypertex:
  # 财务专享 AI 小助手
  - oc_7c6cad99e7f0090c15fc943a12edc6e4
  # Data Pipeline Workshop
  - oc_e11903076f3393e0f237cb406b6c3a07
  # AI 解放生产力
  - oc_0663408600b12ccec166f9889046a36a
  # SpaceSight Tech Sharing Group
  - oc_1d81b1992a1cf99620bf815945782f27

# This list is deliberately NOT the same as the delete-only mutations list
# above: HyperTeX trust and Feishu document deletion are separate grants, so a
# member may hold one without the other.
trusted_feishu_user_ids_for_group_hypertex:
  # 周琛
  - ou_33eeacfbd0c0559b7b734f83503719ab
  # 孙可天
  - ou_1df8d8705eb546b9dc65048ecdbf4002
  # 张文华
  - ou_423ee1666dc00139cbfade9f7e0f037b
  # 李冰洁
  - ou_d97d97c79bd2c6bffaed857dd463b26b
  # 沈舒仪 — HyperTeX only, deliberately absent from the delete list above
  - ou_2f4ae9dcc13555fc703e9813d39ecd81

# Direct file tools may read the wiki. Reads under group_workspace_root are
# narrowed again at runtime to the current group's hashed subdirectory.
allowed_read_roots_for_outsider_groups:
  - ~/.hermes/wiki

group_workspace_root: ~/.hermes/tmp/group-workspaces

# Exact operator-approved actions. Each maps to one fixed script filename in
# feishu_doc_scripts_root; the group can never supply a script path or argv.
allowed_feishu_script_actions_for_outsider_groups:
  - create
  - append
  - rebuild
  - delete
  - read_url
  - download_file

feishu_doc_scripts_root: ~/.hermes/my-skills/productivity/feishu-docs/scripts
python_executable: ~/.hermes/hermes-agent/venv/bin/python
script_timeout_seconds: 300
group_max_download_bytes: 50000000

# Fail closed if the OS process sandbox is unavailable. The profile permits
# reads/execution/network but permits writes only inside the current group
# workspace, and is inherited by child processes such as curl.
require_process_sandbox: true

block_message: "本会话不支持该工具。群聊仅开放问答、联网搜索、只读 wiki/skill、工具发现/描述、当前群隔离的 tmp 工作区、受约束的飞书文档操作，以及面向受信任维护者的 HyperTeX 内测；图片、音频、视频和扫描 PDF 由消息入站多模态链路自动处理。"
